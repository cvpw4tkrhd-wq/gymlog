<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gymlog</title>
<meta name="theme-color" content="#131a24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gymlog">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#131a24; --card:#1c2634; --card2:#243044; --line:#2f3f56;
  --text:#eaf0f7; --mute:#8fa1b8; --blue:#5aa2ff; --amber:#ffc247; --green:#3ddc97; --red:#ff6b6b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom)) 0}
main{max-width:640px;margin:0 auto;padding:12px 14px 24px}
h1,h2,h3{margin:0;line-height:1.2}
h2{font-size:20px}
h3{font-size:17px}
p{margin:6px 0}
small,.mute{color:var(--mute)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--card2);border-radius:12px;padding:10px 14px;min-height:44px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.pri{background:var(--blue);color:#06101f;font-weight:700}
button.ghost{background:transparent;border:1px solid var(--line)}
button.danger{background:transparent;border:1px solid var(--red);color:var(--red)}
.card{background:var(--card);border-radius:16px;padding:14px;margin:12px 0}
.daynav{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center;margin-bottom:4px}
.daynav button{padding:0;font-size:22px}
.daynav .mid{text-align:center}
.daynav .mid b{font-size:19px}
.focus{border-left:4px solid var(--amber);background:var(--card);border-radius:0 14px 14px 0;padding:10px 12px;margin:10px 0}
.banner{background:var(--card2);border-radius:14px;padding:10px 12px;margin:10px 0;font-size:14px}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:1px 9px;margin-left:6px;vertical-align:middle;background:var(--card2);color:var(--mute)}
.chip.a{background:var(--amber);color:#2a1d00}
.chip.b{background:var(--blue);color:#06101f}
.exmeta{font-size:14px;color:var(--mute);margin:2px 0 4px}
.cue{font-size:14px;color:var(--mute);margin:2px 0 8px}
.last{font-size:13px;color:var(--blue);margin:0 0 8px}
.setgrp{font-size:13px;color:var(--mute);margin:10px 0 2px}
.row{display:grid;grid-template-columns:30px 1fr 16px 1fr 52px;gap:6px;align-items:center;margin:5px 0}
.row .lab{font-weight:700;color:var(--mute);text-align:center;font-size:14px}
.row .x{color:var(--mute);text-align:center}
.row input{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:center;font-size:20px;font-variant-numeric:tabular-nums;padding:0 4px}
.row input::placeholder{color:#4d5f78}
.row.drop .lab{color:var(--amber)}
.chk{height:50px;min-height:50px;padding:0;font-size:22px;background:var(--card2);color:var(--mute)}
.chk.on{background:var(--green);color:#04281a}
.row.done input{border-color:var(--green)}
.units{font-size:12px;color:var(--mute);display:grid;grid-template-columns:30px 1fr 16px 1fr 52px;gap:6px;text-align:center;margin-top:4px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:13px;color:var(--mute)}
label.f input,label.f textarea,label.f select{display:block;width:100%;margin-top:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:46px;font-size:16px}
input.dateinp{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-height:44px}
textarea{resize:vertical;min-height:70px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(6,1fr);background:#0e141c;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs button{background:transparent;border-radius:0;color:var(--mute);min-height:58px;font-size:12px;font-weight:600;padding:10px 2px}
nav.tabs button.on{color:var(--text);box-shadow:inset 0 3px 0 var(--blue)}
#timer{position:fixed;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:30;background:var(--blue);color:#06101f;border-radius:16px;padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#timer[hidden]{display:none}
#timer .t{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;flex:1}
#timer button{background:rgba(6,16,31,.18);min-height:40px;padding:6px 12px;font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top));background:var(--text);color:#0b1320;padding:10px 16px;border-radius:99px;font-weight:700;z-index:50;max-width:90%;text-align:center}
#toast[hidden]{display:none}
details{background:var(--card);border-radius:14px;padding:4px 14px;margin:10px 0}
details summary{cursor:pointer;padding:10px 0;font-weight:700;min-height:44px}
details ul{margin:0 0 10px;padding-left:20px}
details li{margin:4px 0}
.dayrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;width:100%;text-align:left;background:var(--card);margin:6px 0;border-radius:14px;padding:12px 14px}
.dayrow.cur{box-shadow:inset 0 0 0 2px var(--blue)}
.dayrow .st{font-size:18px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--card);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
svg.chart{width:100%;height:auto;display:block}
.sess{border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.status{font-size:14px;margin:8px 0}
.ok{color:var(--green)} .err{color:var(--red)}
.meter{margin:12px 0}
.meter .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter .top b{font-size:22px;font-variant-numeric:tabular-nums}
.bar{height:14px;border-radius:99px;background:var(--bg);overflow:hidden;margin:6px 0 2px;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.bar>i.full{background:var(--green)}
.bar>i.over{background:var(--amber)}
.favs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.favs button{background:var(--card2);font-size:14px;padding:8px 12px;min-height:40px}
.entry{display:grid;grid-template-columns:1fr auto 44px;gap:8px;align-items:center;border-top:1px solid var(--line);padding:6px 0}
.entry button{min-height:40px;padding:0;background:transparent;color:var(--mute);font-size:20px}
.modechip{background:var(--card2);border-radius:99px;padding:6px 14px;min-height:36px;font-weight:700;font-size:14px}
.chk2{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute);margin:10px 0}
.chk2 input{width:22px;height:22px}
.sub{margin-top:20px}
@media (prefers-reduced-motion:no-preference){.chk{transition:background .12s}}
</style>
</head>
<body>
<main id="app"></main>
<div id="timer" hidden><span style="font-weight:700">Vila</span><span class="t" id="tleft">0:00</span><button data-act="t30">+30 s</button><button data-act="tstop">Hoppa över</button></div>
<div id="toast" hidden></div>
<nav class="tabs" id="tabs">
  <button data-tab="train">Träna</button>
  <button data-tab="plan">Schema</button>
  <button data-tab="food">Kost</button>
  <button data-tab="prog">Framsteg</button>
  <button data-tab="guide">Guide</button>
  <button data-tab="set">Backup</button>
</nav>

<script>
'use strict';
/* =====================================================================
   DATA: övningar, normalvecka och intensivperioder
   ===================================================================== */
const DAYS = ['mon','tue','wed','thu','fri','sat','sun'];
const DN = {mon:'Måndag',tue:'Tisdag',wed:'Onsdag',thu:'Torsdag',fri:'Fredag',sat:'Lördag',sun:'Söndag'};
const CARDIO_TYPES = ['Promenad','Löpning','Cykel','Roddmaskin','Simning','Annat'];

/* id: [namn, muskelgrupp, teknikråd] */
const EX = {
  // bröst / triceps
  chest:['Hantelpress / bänkpress','Bröst','Skulderbladen ihop och ned, sänk kontrollerat till bröstet.'],
  inclpress:['Lutande hantelpress','Bröst','Bänk ca 30°, armbågarna ca 45° från kroppen.'],
  flyes:['Flyes (kabel eller hantel)','Bröst','Lätt böjda armbågar, känn stretchen i bröstet.'],
  rope:['Triceps pushdown (rep)','Triceps','Armbågarna låsta mot sidan. Dra isär repet i botten.'],
  bar:['Triceps pushdown (rak stång)','Triceps','Armbågarna vid sidan, full sträckning i botten.'],
  ohext:['Triceps overhead extension','Triceps','Kabel eller hantel. Armbågarna pekar uppåt, ordentlig stretch i botten.'],
  french:['Liggande tricepspress','Triceps','EZ-stång eller hantlar, armbågarna stilla. Ömmar armbågarna: byt till kabel overhead.'],
  kick:['Kickbacks','Triceps','Överarmen parallell med golvet, sträck ut helt.'],
  cgbench:['Smal bänkpress','Triceps','Grepp ungefär axelbrett, armbågarna nära kroppen. Gå bara nära failure med spotter eller säkerhetspins.'],
  // rygg
  pulldown:['Latsdrag','Rygg','Dra mot övre bröstet, svinga inte.'],
  row:['Kabelrodd / skivstångsrodd','Rygg','Dra mot naveln, för ihop skulderbladen.'],
  dbrow:['Enarmsrodd med hantel','Rygg','Stöd mot bänk, dra armbågen mot höften.'],
  facepull:['Face pulls','Bakre axlar / rygg','Dra repet mot ansiktet med armbågarna högt, för ihop skulderbladen.'],
  deadlift:['Marklyft','Ben / rygg','Rak rygg, stången nära kroppen, tryck genom golvet. Börja med lätta uppvärmningsset.'],
  // axlar
  shpress:['Sittande hantelpress','Axlar','Pressa rakt upp, undvik att svanka.'],
  latraise:['Stående sidolyft','Axlar','Lyft till axelhöjd, lätt böjda armbågar.'],
  reardelt:['Bakre axel (omvända flyes)','Bakre axlar','Lätt vikt, lyft armarna ut åt sidorna utan sväng.'],
  // biceps
  bbcurl:['Skivstångscurl','Biceps','Armbågarna still vid sidan, ingen sväng med ryggen. Lyft kraftfullt, sänk på ca 2 sek.'],
  dbcurl:['Sittande hantelcurl','Biceps','Luta ryggen mot stödet. Vrid handflatan uppåt under lyftet.'],
  inclcurl:['Lutande hantelcurl','Biceps','Bänk i 45–60°, armarna hänger rakt ned. Sänk långsamt.'],
  hammer:['Hammercurl','Underarmar / brachialis','Tummen uppåt hela vägen. Sänk långsamt.'],
  cablecurl:['Kabelcurl (maskin)','Biceps','Jämn spänning hela vägen. Pressa ihop i toppen.'],
  scott:['Scottcurl','Biceps','Armarna mot pulten. Sänk helt men släpp inte vikten i botten.'],
  // ben / bål
  squat:['Knäböj / benpress','Ben','Kontrollerat djup, sluta 1–2 reps före failure.'],
  rdl:['Rumänska marklyft','Baksida lår','Rak rygg, skjut höften bakåt och känn stretchen i baksida lår.'],
  lunge:['Gående utfall','Ben','Långa steg, kontrollerat. Ange reps per ben.'],
  splitsq:['Bulgarisk split squat','Ben','Bakre foten på bänk. Ange reps per ben.'],
  hipthrust:['Höftlyft (hip thrust)','Säte / baksida lår','Pressa höften upp och spänn sätet i toppen.'],
  calf:['Vadpress (stående)','Vader','Står som "vadcrisps" i programmet, alltså vadpress. Full stretch i botten, paus 1 sek i toppen.'],
  abs:['Crunches / benlyft','Mage','Max reps med bra form. Sluta när formen går.'],
  plank:['Planka','Mage / bål','Rak linje från axel till häl. Skriv antal sekunder i reps-rutan.'],
  // rygg (intensivperiod)
  bbrow:['Skivstångsrodd','Rygg','Lätt framåtlutad med rak rygg, dra stången mot nedre magen. Gå bara nära failure med kontroll.'],
  pullup:['Chins / pull-ups','Rygg','Dra hakan över stången, sänk kontrollerat. Assisterad maskin eller tungt latsdrag går bra. Skriv ev. extra vikt i kg.'],
  cablerow:['Sittande kabelrodd','Rygg','Rak överkropp, dra mot naveln och nyp ihop skulderbladen.'],
  machrow:['Bröststödd rodd (maskin)','Rygg','Bröstet mot stödet, dra armbågarna bakåt och pausa 1 sek.'],
  straightarm:['Raka armar pulldown','Rygg','Nästan raka armar, dra stången mot låren med latsen.'],
  pulldownclose:['Latsdrag med smalt grepp','Rygg','Neutralt eller smalt grepp, dra mot övre bröstet.'],
  shrug:['Hantelshrugs','Rygg (trapezius)','Lyft axlarna rakt upp mot öronen, paus i toppen. Rulla inte axlarna.'],
  backext:['Ryggresningar','Ländrygg','Kontrollerad rörelse upp till rak linje. Överextendera inte.'],
  // bröst
  bench:['Bänkpress (skivstång)','Bröst','Skulderbladen ihop, fötterna i golvet. Gå bara nära failure med spotter eller säkerhetspins.'],
  dbpress:['Hantelpress','Bröst','Sänk kontrollerat, pressa upp och något in mot mitten.'],
  dips:['Dips (bröst)','Bröst','Luta överkroppen lätt framåt, sänk till ca 90° i armbågen. Assisterad maskin vid behov.'],
  machchest:['Bröstpress i maskin','Bröst','Jämn press, full stretch i botten.'],
  inclfly:['Lutande hantelflyes','Bröst','Lätt böjda armbågar, bred båge, känn stretchen i övre bröstet.'],
  pushup:['Armhävningar','Bröst','Rak kropp, bröstet nära golvet. Skriv extra vikt i kg om du använder vikt.'],
  lowfly:['Kabelflyes (nedifrån och upp)','Bröst','Dra kablarna upp och in mot hakan, pressa ihop i toppen.'],
  pecdeck:['Pec deck / flyes i maskin','Bröst','Pressa ihop i mitten och håll 1 sek.'],
  dbpullover:['Hantelpullover','Bröst / rygg','Lätt böjda armbågar, sänk bakom huvudet och dra tillbaka över bröstet.'],
  // ben
  legpress:['Benpress','Ben','Fötterna axelbrett, sänk till ca 90° i knät, pressa utan att låsa knäna.'],
  legext:['Benspark (maskin)','Framsida lår','Pausa 1 sek i toppen, sänk kontrollerat.'],
  legcurl:['Bencurl (maskin)','Baksida lår','Dra hälarna mot sätet, sänk långsamt.'],
  goblet:['Goblet squat','Ben','Hantel mot bröstet, djup knäböj med upprätt kropp.'],
  stepup:['Step-ups','Ben','Högt steg, pressa genom hela foten. Ange reps per ben.'],
  seatedcalf:['Sittande vadpress','Vader','Full stretch i botten, paus i toppen.'],
  // axlar
  ohpress:['Stående skivstångspress','Axlar','Spänn bål och säte, pressa rakt upp förbi ansiktet. Gå bara nära failure med säkerhetspins.'],
  arnold:['Arnoldpress','Axlar','Vrid handflatorna framåt under pressen, kontrollerad sänkning.'],
  frontraise:['Frontlyft','Axlar','Lyft till axelhöjd utan sväng med ryggen.'],
  cablelat:['Sidolyft i kabel','Axlar','Jämn spänning hela rörelsen, lyft till axelhöjd.'],
  machpress:['Axelpress i maskin','Axlar','Kontrollerad press, undvik att svanka.'],
  revpec:['Omvänd pec deck','Bakre axlar','Armarna ut åt sidorna, nyp ihop skulderbladen.'],
  uprow:['Stående rodd (EZ-stång)','Axlar / trapezius','Greppet axelbrett, dra armbågarna uppåt till bröstnivå.'],
  // bål
  cablecrunch:['Kabelcrunch','Mage','Böj ryggraden, dra armbågarna mot knäna, pausa 1 sek.'],
  hangleg:['Hängande benlyft','Mage','Undvik att svinga. Lyft knän eller raka ben till höftnivå eller högre.'],
  abwheel:['Ab-wheel','Mage / bål','Rak linje, rulla ut så långt du kontrollerar och dra tillbaka med magen.'],
  woodchop:['Kabel woodchop','Bål / sneda magmuskler','Rotera från bålen med förlängda armar. Ange reps per sida.'],
  revcrunch:['Omvänd crunch','Mage','Lyft höften från golvet, rulla upp bäckenet kontrollerat.'],
  sideplank:['Sidoplanka','Bål','Rak linje från axel till fot. Ange sekunder per sida i reps-rutan.'],
  russian:['Russian twist','Sneda magmuskler','Vrid bålen, inte bara armarna. Ange reps per sida.'],
  bicycle:['Bicycle crunch','Mage','Långsamt, armbåge mot motsatt knä.'],
  legraise:['Liggande benlyft','Mage','Ländryggen mot golvet, sänk benen kontrollerat.'],
  mountain:['Mountain climbers','Mage / bål','Händerna under axlarna, kontrollerat knädrag. Ange reps per ben.']
};

/* ---------- Normalvecka (mån–fre, helkropp över veckan, 30–40 min) ---------- */
/* [id, set, reps, vila (s)] */
const NORMAL = {
  mon:{title:'Bröst & triceps', ex:[['chest',3,'8–10',120],['inclpress',3,'8–12',90],['flyes',3,'12–15',60],['rope',3,'10–12',75],['ohext',3,'10–12',75]]},
  tue:{title:'Rygg & biceps', ex:[['pulldown',3,'8–12',90],['row',3,'8–10',90],['dbrow',3,'10',75],['facepull',3,'12–15',60],['inclcurl',3,'10–12',75]]},
  wed:{title:'Ben & mage', ex:[['squat',3,'8–10',120],['rdl',3,'8–10',120],['lunge',3,'10',75],['calf',3,'12–15',60],['abs',3,'12–20',60]]},
  thu:{title:'Axlar & armar', ex:[['shpress',3,'8–10',90],['latraise',3,'12–15',60],['reardelt',3,'12–15',60],['bbcurl',3,'8–10',90],['french',3,'10–12',75],['hammer',3,'10–12',75]]},
  fri:{title:'Ben, rygg & bål', ex:[['deadlift',3,'5–6',150],['row',3,'10',90],['splitsq',3,'8–10',90],['hipthrust',3,'10–12',90],['plank',3,'30–60 s',60]]}
};
function buildNormal(d){
  const b=NORMAL[d];
  return {
    title:b.title, label:'Normalvecka', note:'',
    focus:'Normalvecka: hela kroppen fördelad över veckan, 30–40 min per pass. Stanna 1–2 reps före failure. Klarar du övre repgränsen på alla set: höj vikten nästa gång.',
    blocks:b.ex.map(r=>[{id:r[0],sets:r[1],reps:r[2],rest:r[3],rir:'RIR 1–2'}])
  };
}
function buildWeekend(d){
  return {
    rest:true, weekend:true, label:'Helg', blocks:[],
    title:d==='sat'?'Lördag – kondition eller vila':'Söndag – vila (eller lätt kondition)',
    focus:'Helg: kondition eller vila. 30–45 min i lugnt tempo (promenad, cykel, jogg) ger återhämtning och bra kondition. Logga det nedan.',
    note:''
  };
}

/* ---------- Intensivperioder: 4-veckors chockfas (3 intensiva veckor + deload) ----------
   Samma upplägg för alla muskelgrupper, precis som armprogrammet:
   Mån Pass A (tungt) · Tis underhåll · Ons Pass B (volym & pump) · Tors underhåll · Fre Pass C (isolering & superset)
   Övning: [id, set, reps, vila (s), 'h' = tungt baslyft (aldrig till failure utan spotter)] */
const INT_WEEKS = {1:'Introduktion',2:'Toppning',3:'Chockfas',4:'Deload (obligatorisk)'};
function intFocus(def,w){
  return {
    1:'Hitta rätt vikter. Tungt men kontrollerat. Stanna 2 reps före failure (RIR 2) på alla '+def.noun+'.',
    2:'Öka vikten något jämfört med vecka 1 (eller ta minst 1 rep mer per set). Stanna 1 rep före failure (RIR 1).',
    3:'Kör till strikt failure på sista setet. Fredag = dropset! Sov och ät ordentligt den här veckan.',
    4:'Deload – obligatorisk. Halvera vikterna och seten. Det är NU '+def.grow+' växer!'
  }[w];
}
const LEGS_ABS=['Ben & mage – underhåll',[['squat',3,'8',120],['rdl',3,'8',120],['calf',3,'12–15',60],['abs',3,'max',60]]];
const CHEST_BACK=['Rygg & bröst – underhåll',[['chest',3,'8',120],['row',3,'8',120],['pulldown',3,'10',90]]];
const INT_DEFS = [
  {id:'arms',name:'Armar',noun:'armövningar',grow:'armarna',
   titles:['Armar A – tung styrka + axlar','Armar B – volym & pump','Armar C – isolering & superset'],
   A:[['bbcurl',4,'6–8',120],['cgbench',4,'6–8',120,'h'],['dbcurl',3,'8',90],['ohext',3,'8',90]],
   addMon:[['shpress',3,'8',90],['latraise',3,'10–12',60]],
   tue:{title:LEGS_ABS[0],ex:LEGS_ABS[1]},
   B:[['inclcurl',3,'10–12',75],['rope',3,'10–12',75],['hammer',3,'10–12',75],['french',3,'10–12',75]],
   thu:{title:'Rygg & bröst – underhåll',ex:CHEST_BACK[1]},
   C:[[['cablecurl',3,'12–15',75],['bar',3,'12–15',75]],[['scott',3,'12–15',75],['kick',3,'12–15',75]]]},
  {id:'back',name:'Rygg',noun:'ryggövningar',grow:'ryggen',

function mkItem(r,focus){return {id:r[0],sets:r[1],reps:r[2],rest:r[3],arm:focus,heavy:r[4]==='h',maint:!focus};}
function buildIntensive(def,w,d){
  const label='Intensiv · '+def.name+' · vecka '+w+' av 4', focus=intFocus(def,w);
  if(w===4&&(d==='tue'||d==='thu'))return {rest:true,title:d==='tue'?'Vila eller lätt promenad':'Vila',label,focus,note:'Deload-vecka. Återhämtning är träningen i dag.',blocks:[]};
  let title,list;
  if(d==='mon'){title=def.titles[0];list=def.A.map(r=>mkItem(r,true)).concat((def.addMon||[]).map(r=>mkItem(r,false)));}
  else if(d==='tue'){title=def.tue.title;list=def.tue.ex.map(r=>mkItem(r,false));}
  else if(d==='wed'){title=def.titles[1];list=def.B.map(r=>mkItem(r,true));}
  else if(d==='thu'){title=def.thu.title;list=def.thu.ex.map(r=>mkItem(r,false));}
  else{title=def.titles[2];list=[];def.C.forEach((pair,pi)=>pair.forEach(r=>{const x=mkItem(r,true);x.ss='AB'[pi];list.push(x);}));}
  let note='';
  if(w===4){
    list=list.filter(x=>x.arm).map(x=>Object.assign({},x,{sets:Math.max(2,Math.ceil(x.sets/2)),rest:60,ss:null,deload:true,rir:'RIR 4+ – ska kännas lätt'}));
    note=d==='mon'?'Ingen underhållsträning i dag. Halvera vikterna (ca 50 % av vecka 3) och seten.':d==='fri'?'Inga superset och inga dropset. Gör övningarna en i taget. Halva vikterna, halva seten.':'Mycket lätt. Halva vikterna (ca 50 % av vecka 3) och halva seten.';
  } else {
    list.forEach(x=>{
      if(!x.arm){x.rir='RIR 2';return;}
      x.rir=w===1?'RIR 2':w===2?'RIR 1':'RIR 1, sista setet till failure';
      if(d==='wed'){x.tempo='3 sek negativ fas (håll emot på vägen ned)';x.restTxt='60–75 s';}
      if(w===3){
        if(d==='mon'){if(x.heavy)x.rir='RIR 0–1 på sista setet, bara med spotter/pins';else x.fail=true;}
        if(d==='wed'){x.sets=x.sets+1;x.fail=true;}
        if(d==='fri'){x.drop=2;x.rir='RIR 1 – set 3: failure + dropset';}
      }
    });
    if(w===2&&d==='mon')note='Öka vikten på de två första övningarna.';
    if(w===2&&d==='wed')note='Fokusera på maximal muskelkontakt.';
    if(w===2&&d==='fri')note='Pressa så att sista repsen i varje superset är riktigt tung.';
    if(w===3&&d==='mon')note='Sista setet av varje övning till failure (tunga baslyft: RIR 0–1 med spotter).';
    if(w===3&&d==='wed')note='Lägg till ett extra 4:e set på varje övning. Sista setet till failure.';
    if(w===3&&d==='fri')note='Sista setet (set 3) i båda supersetten blir dropset: kör till failure, sänk vikten direkt med ca 30 % och kör så många reps du kan.';
    if(d==='wed'&&w<3)note=(note?note+' ':'')+'Fokus på 3 sekunder negativ fas (håll emot på vägen ned).';
    if(d==='fri')note=(note?note+' ':'')+'Kör A1 direkt följt av A2, vila sedan. Samma för B1/B2.';
    if(w>=2&&(d==='tue'||d==='thu'))note='Underhåll: samma vikter och set som vecka 1.';
  }
  const blocks=[];let i=0;
  while(i<list.length){
    const x=list[i];
    if(x.ss){const g=[];while(i<list.length&&list[i].ss===x.ss){list[i].tag=x.ss+(g.length+1);g.push(list[i]);i++;}blocks.push(g);}
    else{blocks.push([x]);i++;}
  }
  return {title,label,focus,note,blocks,deload:w===4};
}

/* ---------- Register över perioder ----------
   Lägg till fler perioder genom att lägga till en definition i INT_DEFS ovan,
   eller en egen post här med name, weeks, desc, weekName(vecka), focusFor(vecka), build(vecka, dag). */
const BLOCKS = {};
INT_DEFS.forEach(def=>{
  BLOCKS[def.id]={
    name:def.name+' – 4-veckors chockfas', weeks:4,
    desc:'3 intensiva veckor + 1 deload-vecka (obligatorisk) med fokus på '+def.grow+'. Ersätter normalveckan måndag–fredag.',
    weekName:w=>INT_WEEKS[w], focusFor:w=>intFocus(def,w), build:(w,d)=>buildIntensive(def,w,d)
  };
});

function planFor(key){
  const p=String(key).split(':');
  if(p[0]==='n'&&NORMAL[p[1]])return buildNormal(p[1]);
  if(p[0]==='w')return buildWeekend(p[1]);
  if(p[0]==='b'&&BLOCKS[p[1]]){try{return BLOCKS[p[1]].build(+p[2],p[3]);}catch(e){}}
  return {rest:true,title:'Okänt pass',label:'',focus:'',note:'',blocks:[]};
}

function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseISO(s){return new Date(s+'T00:00:00');}
const today=()=>iso(new Date());
function addDays(ds,n){const d=parseISO(ds);d.setDate(d.getDate()+n);return iso(d);}
function dowOf(ds){return (parseISO(ds).getDay()+6)%7;}
function mondayISO(ds){return addDays(ds,-dowOf(ds));}
function diffDays(a,b){return Math.round((parseISO(a)-parseISO(b))/864e5);}
function fd(ds){return parseISO(ds).toLocaleDateString('sv-SE',{day:'numeric',month:'short'});}
function isoWeek(ds){const d=parseISO(ds);const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));t.setUTCDate(t.getUTCDate()-((t.getUTCDay()+6)%7)+3);const f=new Date(Date.UTC(t.getUTCFullYear(),0,4));return 1+Math.round(((t-f)/864e5-3+((f.getUTCDay()+6)%7))/7);}
function parseNum(v){v=String(v).replace(',','.').trim();if(v==='')return '';const n=parseFloat(v);return isNaN(n)?'':n;}

function upgrade(st){
  st=st||{};
  st.sessions=st.sessions||{};
  if((st.v||1)<2){
    // v1: pass nycklade på period/vecka/dag -> v2: nycklade på datum, med planrad
    const ns={};
    Object.values(st.sessions).forEach(s=>{
      const date=s.date||today(), id='d'+date;
      const n2=Object.assign({},s,{id,date,plan:'b:arms:'+s.week+':'+s.day});
      delete n2.cycle;delete n2.week;delete n2.day;
      if(!ns[id]||(s.updatedAt||0)>(ns[id].updatedAt||0))ns[id]=n2;
    });
    st.sessions=ns;
    st.blocks=st.blocks||[];
    if(st.start)st.blocks.push({id:'mig-'+st.start,type:'arms',start:mondayISO(st.start),updatedAt:st.startAt||Date.now()});
    delete st.start;delete st.startAt;delete st.cycle;
  }
  st.v=2;
  st.blocks=st.blocks||[];st.cardio=st.cardio||{};st.food=st.food||{};st.favs=st.favs||[];
  if(!st.targets||!st.targets.train||!st.targets.rest||!st.targets.at)st.targets=defT();
  return st;
}

function blockAt(ds){
  for(const b of S.blocks){
    if(b.del||!BLOCKS[b.type])continue;
    const def=BLOCKS[b.type], n=diffDays(ds,b.start);
    if(n>=0&&n<def.weeks*7)return {b,def,week:Math.floor(n/7)+1,dow:n%7};
  }
  return null;
}
function defaultPlan(ds){
  const dow=dowOf(ds), bk=blockAt(ds);
  if(dow>4)return 'w:'+(dow===5?'sat':'sun');
  if(bk)return 'b:'+bk.b.type+':'+bk.week+':'+DAYS[dow];
  return 'n:'+DAYS[dow];
}
function planKeyFor(ds){const s=S.sessions['d'+ds];return s&&s.plan?s.plan:defaultPlan(ds);}
function planOptions(ds){
  const o=[];
  DAYS.slice(0,5).forEach(d=>o.push(['n:'+d,'Normal · '+DN[d]+' – '+NORMAL[d].title]));

  o.push(['w:sat','Kondition / vila']);
  return o;
}

function lastFor(exId){
  const c=Object.values(S.sessions).filter(s=>s.date!==ui.date&&s.sets&&s.sets[exId]&&s.sets[exId].some(x=>x.done)).sort((a,b)=>a.date<b.date?1:-1);
  const prev=c.find(s=>s.date<ui.date)||c[0];
  return prev?prev.sets[exId].filter(x=>x.done):null;
}
function ph(x,i){
  const last=lastFor(x.id);if(!last||!last.length)return {};
  const l=last[Math.min(i,last.length-1)];
  let w=l.w;if(x.deload&&w!=='')w=Math.round(w*0.5*2)/2;
  return {w:w,r:l.r};
}
const e1=(w,r)=>w>0&&r>0?w*(1+r/30):0;
function bestE1(exId,exclude){
  let b=0;
  Object.values(S.sessions).forEach(s=>{if(s.id===exclude||!s.sets||!s.sets[exId])return;
    s.sets[exId].forEach(x=>{if(x.done){b=Math.max(b,e1(+x.w,+x.r));if(x.dw!==undefined&&x.dw!==''&&x.dr)b=Math.max(b,e1(+x.dw,+x.dr));}});});
  return b;
}

function setRow(x,i,s,sup){

  let h=`<div class="setwrap"><div class="row${v.done?' done':''}"><span class="lab">${lab}</span>
    <input type="text" inputmode="decimal" class="w" data-ex="${x.id}" data-i="${i}" data-f="w" value="${v.w===''?'':esc(v.w)}" placeholder="${p.w!==undefined&&p.w!==''?esc(p.w):'kg'}" aria-label="Vikt set ${i+1}">
    <span class="x">×</span>

    <button class="chk${v.done?' on':''}" data-act="chk" data-ex="${x.id}" data-i="${i}" aria-label="Klart">✓</button></div>`;
  if(chips)h+=`<div style="margin:0 0 2px 36px">${chips}</div>`;
  if(isDrop){
    const dph=v.w!==''?Math.round(v.w*0.7*2)/2:'';
    h+=`<div class="row drop"><span class="lab">↓</span>
    <input type="text" inputmode="decimal" class="dw" data-ex="${x.id}" data-i="${i}" data-f="dw" value="${v.dw===undefined||v.dw===''?'':esc(v.dw)}" placeholder="${dph!==''?esc(dph):'−30 %'}" aria-label="Dropset vikt">
    <span class="x">×</span>
    <input type="text" inputmode="numeric" data-ex="${x.id}" data-i="${i}" data-f="dr" value="${v.dr===undefined||v.dr===''?'':esc(v.dr)}" placeholder="reps" aria-label="Dropset reps"><span></span></div>`;
  }

}
function summary(s){
  if(!s)return 'Inget loggat än.';
  let sets=0,vol=0;
  Object.values(s.sets).forEach(a=>a.forEach(x=>{if(x.done){sets++;vol+=(+x.w||0)*(+x.r||0);if(x.dw&&x.dr)vol+=(+x.dw)*(+x.dr);}}));
  return `${sets} set klara · volym ${fmtN(vol)} kg`;
}

/* ---------- Framsteg ---------- */
function sessionsWithEx(id){
  return Object.values(S.sessions).filter(s=>s.sets&&s.sets[id]&&s.sets[id].some(x=>x.done)).sort((a,b)=>a.date<b.date?-1:1);
}
function weekRows(){
  const m={};
  const R=k=>(m[k]=m[k]||{n:0,sets:0,vol:0,cm:0});
  Object.values(S.sessions).forEach(s=>{
    let any=false,sets=0,vol=0;
    Object.values(s.sets||{}).forEach(a=>a.forEach(x=>{if(x.done){any=true;sets++;vol+=(+x.w||0)*(+x.r||0);if(x.dw&&x.dr)vol+=(+x.dw)*(+x.dr);}}));
    if(any){const r=R(mondayISO(s.date));r.n++;r.sets+=sets;r.vol+=vol;}
  });
  Object.keys(S.cardio).forEach(d=>{const mm=cardioMins(d);if(mm)R(mondayISO(d)).cm+=mm;});
  return Object.keys(m).sort().reverse().slice(0,8).map(k=>Object.assign({k},m[k]));
}
function viewProg(){
  const all=Object.values(S.sessions);let n=0,sets=0,vol=0;
  all.forEach(s=>{let any=false;Object.values(s.sets||{}).forEach(a=>a.forEach(x=>{if(x.done){any=true;sets++;vol+=(+x.w||0)*(+x.r||0);if(x.dw&&x.dr)vol+=(+x.dw)*(+x.dr);}}));if(any)n++;});
  const ids=Object.keys(EX).filter(id=>sessionsWithEx(id).length);
  let h=`<h2>Framsteg</h2><div class="stat" style="margin-top:10px"><div><b>${n}</b><small>pass</small></div><div><b>${sets}</b><small>set</small></div><div><b>${(vol/1000).toFixed(1).replace('.',',')}</b><small>ton lyft</small></div></div>`;
  const wr=weekRows();
  if(wr.length){
    h+=`<div class="card"><h3>Vecka för vecka</h3>`;
    wr.forEach(r=>{h+=`<div class="sess"><b>Vecka ${isoWeek(r.k)}</b> · ${esc(fd(r.k))}<br>${r.n} pass · ${r.sets} set · ${(r.vol/1000).toFixed(1).replace('.',',')} ton${r.cm?` · ${fmtN(r.cm)} min kondition`:''}</div>`;});
    h+=`</div>`;
  }
  if(!ids.length)return h+`<div class="card"><p>Logga ditt första pass så dyker graferna upp här.</p></div>`;
  if(!ids.includes(ui.ex))ui.ex=ids[0];
  h+=`<div class="card"><label class="f">Övning<select data-act="exsel">${ids.map(id=>`<option value="${id}"${id===ui.ex?' selected':''}>${esc(EX[id][0])}</option>`).join('')}</select></label>`;
  const ss=sessionsWithEx(ui.ex);
  const pts=ss.map(s=>{let b=0;s.sets[ui.ex].forEach(x=>{if(x.done)b=Math.max(b,e1(+x.w,+x.r));});return {d:s.date,b};});
  h+=chart(pts)+`<p class="mute" style="font-size:13px">Linjen visar uppskattad maxstyrka (1RM, Epley) per pass.</p>`;
  ss.slice().reverse().slice(0,8).forEach(s=>{
    h+=`<div class="sess"><b>${esc(fd(s.date))}</b> · ${esc(planFor(s.plan).title)}<br>${s.sets[ui.ex].filter(x=>x.done).map(x=>(x.w===''?'0':x.w)+'×'+x.r+(x.dw?` ↓${x.dw}×${x.dr||'?'}`:'')).join(' · ')}</div>`;
  });
  return h+`</div>`;
}
function chart(pts){
  const p=pts.filter(x=>x.b>0);if(!p.length)return '<p class="mute">Ingen vikt loggad för den här övningen.</p>';
  const W=320,H=150,L=34,R=10,T=10,B=24;
  const ys=p.map(x=>x.b),mn=Math.min(...ys),mx=Math.max(...ys),span=Math.max(mx-mn,1);
  const X=i=>p.length===1?(L+(W-L-R)/2):L+i*(W-L-R)/(p.length-1);
  const Y=v=>T+(H-T-B)*(1-(v-mn)/span);
  const line=p.map((x,i)=>`${X(i).toFixed(1)},${Y(x.b).toFixed(1)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Styrkeutveckling">
  <line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="#2f3f56"/>
  <text x="${L-4}" y="${Y(mx)+4}" fill="#8fa1b8" font-size="11" text-anchor="end">${Math.round(mx)}</text>
  <text x="${L-4}" y="${Y(mn)+4}" fill="#8fa1b8" font-size="11" text-anchor="end">${Math.round(mn)}</text>
  <polyline points="${line}" fill="none" stroke="#5aa2ff" stroke-width="2.5" stroke-linejoin="round"/>
  ${p.map((x,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(x.b).toFixed(1)}" r="4" fill="${x.b===mx?'#ffc247':'#5aa2ff'}"/>`).join('')}
  <text x="${L}" y="${H-6}" fill="#8fa1b8" font-size="11">${esc(p[0].d.slice(5))}</text>
  <text x="${W-R}" y="${H-6}" fill="#8fa1b8" font-size="11" text-anchor="end">${esc(p[p.length-1].d.slice(5))}</text></svg>`;
}

function ftot(ds){const d=S.food[ds];let p=0,k=0;if(d)d.entries.forEach(e=>{if(!e.del){p+=+e.p||0;k+=+e.k||0;}});return {p,k};}

function meter(label,val,tgt,unit,hi){
  const top=hi&&hi>tgt?hi:tgt, pct=top>0?Math.min(100,val/top*100):0;
  let cls='',txt='';
  if(unit==='kcal'){
    cls=val>top?'over':val>=tgt?'full':'';
    txt=val<tgt?'kvar '+fmtN(tgt-val)+' kcal till målzonen':val<=top?'i målzonen ✓':'över med '+fmtN(val-top)+' kcal';
  } else {
    cls=val>=tgt?'full':'';
    txt=val>=tgt?'minst-målet nått ✓':'kvar '+fmtN(tgt-val)+' g';
  }
  const rng=top>tgt?fmtN(tgt)+'–'+fmtN(top):fmtN(tgt);
  return `<div class="meter"><div class="top"><span>${label}</span><span><b>${fmtN(val)}</b> / ${rng} ${unit}${unit==='g'?' (minst)':''}</span></div><div class="bar"><i class="${cls}" style="width:${pct.toFixed(1)}%"></i></div><small>${txt}</small></div>`;
}

<li><b>Vecka 1 (introduktion):</b> stanna 2 reps före failure (RIR 2) på alla armövningar.</li>
<li><b>Vecka 2 (toppning):</b> öka vikten något, stanna 1 rep före failure (RIR 1).</li>
<li><b>Vecka 3 (chockfas):</b> kör till strikt failure på sista setet. Fredag = dropset!</li>
<li><b>Vecka 4 (deload, obligatorisk):</b> halvera vikterna och seten. Det är nu armarna växer!</li>
<li><b>Kost och återhämtning:</b> 2 700–2 900 kcal per dag (litet överskott), minst 150 g protein per dag, 7–9 timmars sömn per natt.</li></ul></details>
<details><summary>RIR och failure</summary><ul>
<li><b>RIR</b> = reps kvar i tanken. RIR 2 betyder att du slutar när du skulle klara 2 reps till med bra form.</li>
<li><b>Teknisk failure</b> = du klarar inte en rep till med bra form. Kasta inte vikten och fuska inte med ryggen.</li>
<li>Gå aldrig till failure på tunga basövningar som smal bänkpress utan spotter eller säkerhetspins.</li></ul></details>
<details><summary>Progression (dubbel progression)</summary><ul>
<li>Välj en vikt där du hamnar inom repintervallet med rätt RIR. Första passet är till för att hitta vikterna.</li>
<li>Klarar du övre gränsen av repintervallet på alla set: höj vikten nästa gång (ca 2,5 kg på curl och press, 1–2,5 kg på isolering, 5 kg på ben och marklyft).</li>
<li>Klarar du inte det: behåll vikten och försök ta 1 rep mer per set.</li></ul></details>
<details><summary>Uppvärmning, vila och tempo</summary><ul>
<li>3–5 min lätt cardio. På första övningen: 1 set ca 50 % × 8, 1 set ca 70 % × 4.</li>
<li>Tunga övningar 2 min vila, mellansvåra 90 s, pumpövningar 60–75 s. Vilotimern startar när du bockar av ett set.</li>
<li>Planka loggas i sekunder (skriv sekunderna i reps-rutan).</li></ul></details>
<details><summary>Intensivperioder – vecka för vecka</summary><ul>
<li><b>Vecka 1:</b> hitta vikterna, RIR 2 på alla övningar för muskelgruppen.</li>
<li><b>Vecka 2:</b> öka vikten något (eller ta 1 rep mer), RIR 1.</li>
<li><b>Vecka 3:</b> mån: sista setet av varje övning till failure (tunga baslyft RIR 0–1 med spotter). Ons: extra 4:e set, sista till failure. Fre: sista setet i båda supersetten som dropset (sänk vikten direkt med ca 30 %).</li>
<li><b>Vecka 4:</b> deload, halva vikterna och halva seten. Tis och tors är vila.</li>
<li>Känner du smärta i armbågar eller senor (inte bara muskelbränna): avbryt övningen och byt till en kabelvariant.</li></ul></details>
<details><summary>Kost i appen</summary><ul>
<li>Fliken Kost loggar protein, kalorier och sömn per dag. Målen kan vara olika för träningsdagar och vilodagar.</li>
<li>Dagtypen väljs automatiskt (helger och vilodagar är vila). Tryck på knappen för att byta manuellt.</li>
<li>Spara vanliga måltider som favoriter, då loggar du dem med ett tryck.</li></ul></details>
<details><summary>Mat, sömn och återhämtning</summary><ul>
<li>Kalorier: 2 700–2 900 kcal per dag (litet överskott). Protein: minst 150 g per dag, fördelat på 3–4 mål.</li>
<li>Sömn: 7–9 timmar per natt. Logga den under Kost.</li>
<li>Under chockveckan är det extra viktigt att inte gå på underskott. Kreatin (3–5 g/dag) är välstuderat och valfritt.</li></ul></details>`;
}

/* =====================================================================
   TIMER, LJUD, TOAST
   ===================================================================== */
let tm=null,tEnd=0,ac=null,tt=null,wake=null;
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function startTimer(sec){stopTimer();tEnd=Date.now()+sec*1000;$('#timer').hidden=false;tick();tm=setInterval(tick,250);}
function tick(){const left=Math.max(0,Math.ceil((tEnd-Date.now())/1000));$('#tleft').textContent=fmt(left);if(left<=0)stopTimer(true);}
function stopTimer(fire){clearInterval(tm);tm=null;$('#timer').hidden=true;if(fire){beep();if(navigator.vibrate)navigator.vibrate([200,100,200]);toast('Vilan är slut – kör nästa set');}}
function beep(){try{if(!ac)return;[0,0.28].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=0.15;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+0.18);});}catch(e){}}
function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2600);}
async function keepAwake(){try{if('wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null);}}catch(e){}}

/* =====================================================================
   HÄNDELSER
   ===================================================================== */
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');
  if(tb){if(tb.dataset.fd)fdate=tb.dataset.fd;ui.tab=tb.dataset.tab;render();window.scrollTo(0,0);return;}
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  if(a==='prev'||a==='next'){ui.date=addDays(ui.date,a==='next'?1:-1);render();window.scrollTo(0,0);}
  else if(a==='today'){ui.date=today();render();}
  else if(a==='open'){ui.date=t.dataset.d;ui.tab='train';render();window.scrollTo(0,0);}
  else if(a==='swprev'||a==='swnext'){sw=addDays(sw,a==='swnext'?7:-7);render();}
  else if(a==='swtoday'){sw=mondayISO(today());render();}
  else if(a==='chk')toggleSet(t);
  else if(a==='finish'){const s=getSess(true);s.finished=!s.finished;touch(s);if(s.finished){toast('Bra jobbat!');stopTimer();}render();}
  else if(a==='t30'){tEnd+=30000;tick();}
  else if(a==='tstop')stopTimer();
  else if(a==='cadd'){
    const m=parseNum($('#cm').value),k=parseNum($('#ck').value);
    if(m===''||m<=0){toast('Fyll i antal minuter');return;}
    const d=(S.cardio[ui.date]=S.cardio[ui.date]||{entries:[],updatedAt:0});
    d.entries.push({id:uid(),t:$('#ct').value,m:m,k:k===''?'':k,updatedAt:Date.now()});
    d.updatedAt=Date.now();persist();queueSync();render();toast('Kondition tillagd');
  }
  else if(a==='cdel'){const d=S.cardio[ui.date];const x=d&&d.entries.find(z=>z.id===t.dataset.id);if(x){x.del=true;x.updatedAt=Date.now();d.updatedAt=Date.now();persist();queueSync();render();}}
  else if(a==='bset'){const el=$('#bs');if(el)el.value=addDays(mondayISO(today()),+t.dataset.v);}
  else if(a==='badd'){
    const type=$('#bt').value,def=BLOCKS[type];let start=$('#bs').value;
    if(!start){toast('Välj ett startdatum');return;}
    const mon=mondayISO(start);if(mon!==start){start=mon;toast('Startar måndagen '+fd(start));}
    const end=addDays(start,def.weeks*7);
    const clash=S.blocks.some(b=>!b.del&&BLOCKS[b.type]&&start<addDays(b.start,BLOCKS[b.type].weeks*7)&&b.start<end);
    if(clash){toast('Perioden krockar med en annan period');return;}
    S.blocks.push({id:uid(),type,start,updatedAt:Date.now()});persist();queueSync();render();toast('Period inplanerad');
  }
  else if(a==='bdel'){const b=S.blocks.find(x=>x.id===t.dataset.id);if(b&&confirm('Ta bort perioden? Loggade pass finns kvar.')){b.del=true;b.updatedAt=Date.now();persist();queueSync();render();}}
  else if(a==='fprev'||a==='fnext'){const d=addDays(fdate,a==='fnext'?1:-1);if(d<=today()){fdate=d;render();}}
  else if(a==='fmode'){const d=fday(fdate,true);d.mode=d.mode===''?'train':d.mode==='train'?'rest':'';ftouch(d);render();}
  else if(a==='fadd'){
    const n=$('#fn').value.trim(),p=parseNum($('#fp').value),k=parseNum($('#fk').value);
    if(p===''&&k===''){toast('Fyll i protein eller kalorier');return;}
    addEntry(fdate,n,p,k);
    if($('#ffav').checked){if(n){S.favs.push({id:uid(),n:n,p:p===''?0:p,k:k===''?0:k,updatedAt:Date.now()});persist();}else toast('Favorit kräver ett namn');}
    render();toast('Tillagt');
  }
  else if(a==='favadd'){const f=S.favs.find(x=>x.id===t.dataset.id);if(f){addEntry(fdate,f.n,f.p,f.k);render();toast('Lade till '+f.n);}}
  else if(a==='fdel'){const d=fday(fdate,false);const x=d&&d.entries.find(z=>z.id===t.dataset.id);if(x){x.del=true;x.updatedAt=Date.now();ftouch(d);render();}}
  else if(a==='favdel'){const f=S.favs.find(x=>x.id===t.dataset.id);if(f){f.del=true;f.updatedAt=Date.now();persist();queueSync();render();}}
  else if(a==='savetok'){cfg.token=$('#tok').value.trim();cfg.status='';saveCfg();syncNow(true);}
  else if(a==='sync')syncNow(true);
  else if(a==='export')exportJSON();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='exsel'){ui.ex=t.value;render();}
  else if(t.dataset.act==='jump'){if(t.value){ui.date=t.value;render();}}
  else if(t.dataset.act==='plansel'){
    const s=S.sessions['d'+ui.date];
    if(s&&hasDone(s)&&s.plan!==t.value){toast('Passet har loggade set – ta bort dem först');render();return;}
    const ns=getSess(true);ns.plan=t.value;ns.sets={};initSets(ns);touch(ns);render();toast('Pass bytt');
  }
  else if(t.dataset.tg){const [k,f]=t.dataset.tg.split('.');const v=parseNum(t.value);if(v!==''&&v>0){S.targets[k][f]=v;S.targets.at=Date.now();persist();queueSync();render();toast('Mål sparat');}}
  else if(t.id==='imp'&&t.files[0])importJSON(t.files[0]);
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.f){
    const s=getSess(true),arr=(s.sets[el.dataset.ex]=s.sets[el.dataset.ex]||[]),i=+el.dataset.i;
    const set=(arr[i]=arr[i]||{w:'',r:'',done:false});
    set[el.dataset.f]=parseNum(el.value);
    if(el.dataset.f==='w'){const dw=el.closest('.setwrap').querySelector('.dw');if(dw&&dw.value==='')dw.placeholder=set.w===''?'−30 %':Math.round(set.w*0.7*2)/2;}
    touch(s);
  } else if(el.dataset.sf){
    const s=getSess(true);s[el.dataset.sf]=el.dataset.sf==='bw'?parseNum(el.value):el.value;touch(s);
  } else if(el.dataset.fs){
    const d=fday(fdate,true);d[el.dataset.fs]=parseNum(el.value);ftouch(d);
    const mg=$('#slmsg');if(mg&&el.dataset.fs==='sleep'){const v=d.sleep;mg.textContent=v===''?'':(v>=7&&v<=9?'✅ inom målet':v<7?'under 7 h':'över 9 h');}
  }
});
function toggleSet(btn){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  keepAwake();
  const s=getSess(true),exId=btn.dataset.ex,i=+btn.dataset.i;
  const arr=(s.sets[exId]=s.sets[exId]||[]);
  const set=arr[i]||(arr[i]={w:'',r:'',done:false});
  const row=btn.closest('.row');
  if(set.done){set.done=false;touch(s);btn.classList.remove('on');row.classList.remove('done');return;}
  const wI=row.querySelector('.w'),rI=row.querySelector('.r');
  if(wI.value===''&&wI.placeholder&&!isNaN(parseNum(wI.placeholder))&&wI.placeholder!=='kg'){wI.value=wI.placeholder;set.w=parseNum(wI.value);}
  if(rI.value===''&&rI.placeholder&&!isNaN(parseNum(rI.placeholder))&&rI.placeholder!=='reps'){rI.value=rI.placeholder;set.r=parseNum(rI.value);}
  if(set.r===''||set.r===undefined){toast('Fyll i reps först');return;}
  const prev=bestE1(exId,s.id),now=e1(+set.w,+set.r);
  set.done=true;touch(s);btn.classList.add('on');row.classList.add('done');
  const x=planFor(s.plan).blocks.flat().find(z=>z.id===exId);
  if(prev>0&&now>prev*1.001)toast('🏆 Nytt PR på '+(EX[exId]?EX[exId][0]:exId));
  if(x&&x.rest&&(!x.ss||x.tag.endsWith('2')))startTimer(x.rest);
}

/* =====================================================================
   BACKUP: export, import, Gist
   ===================================================================== */
function mergeById(a,b){const m=new Map();[...(a||[]),...(b||[])].forEach(x=>{const y=m.get(x.id);if(!y||(x.updatedAt||0)>(y.updatedAt||0))m.set(x.id,x);});return [...m.values()];}
function mergeDays(A,B){
  const o={};
  new Set([...Object.keys(A||{}),...Object.keys(B||{})]).forEach(k=>{
    const x=(A||{})[k],y=(B||{})[k];
    if(!x||!y){o[k]=x||y;return;}
    const n=(y.updatedAt||0)>(x.updatedAt||0)?y:x;
    o[k]=Object.assign({},n,{entries:mergeById(x.entries,y.entries),updatedAt:Math.max(x.updatedAt||0,y.updatedAt||0)});
  });
  return o;
}
function mergeState(a,b){
  a=upgrade(JSON.parse(JSON.stringify(a)));b=upgrade(JSON.parse(JSON.stringify(b)));
  const o={v:2,sessions:{}};
  new Set([...Object.keys(a.sessions),...Object.keys(b.sessions)]).forEach(id=>{
    const x=a.sessions[id],y=b.sessions[id];
    o.sessions[id]=!x?y:!y?x:((y.updatedAt||0)>(x.updatedAt||0)?y:x);
  });
  o.food=mergeDays(a.food,b.food);o.cardio=mergeDays(a.cardio,b.cardio);
  o.favs=mergeById(a.favs,b.favs);o.blocks=mergeById(a.blocks,b.blocks);
  o.targets=(b.targets.at||0)>(a.targets.at||0)?b.targets:a.targets;
  return o;
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='gymlog-backup-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function importJSON(f){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.sessions)throw 0;S=mergeState(S,d);persist();queueSync();render();toast('Backup inläst');}catch(e){toast('Filen kunde inte läsas');}};
  r.readAsText(f);
}
async function gh(path,opt){
  const r=await fetch('https://api.github.com'+path,Object.assign({},opt,{headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+cfg.token,'Content-Type':'application/json'}}));
  if(!r.ok){const t=await r.text();throw new Error(r.status+(r.status===401?' (felaktig token)':r.status===403||r.status===404?' (saknar gist-behörighet?)':'')+' '+t.slice(0,80));}
  return r.json();
}
async function findGist(){
  for(let p=1;p<=5;p++){const l=await gh('/gists?per_page=100&page='+p);const g=l.find(x=>x.files&&x.files[FILE]);if(g)return g.id;if(l.length<100)break;}
  return '';
}
let syncing=false,syncT=null;
function queueSync(){if(!cfg.token)return;clearTimeout(syncT);syncT=setTimeout(()=>syncNow(false),5000);}
async function syncNow(manual){
  if(!cfg.token){if(manual)toast('Lägg in token först');return;}
  if(!navigator.onLine){cfg.status='Offline – synkas när du har nät';saveCfg();if(manual)toast('Du är offline');return;}
  if(syncing)return;syncing=true;
  try{
    let id=cfg.gistId||await findGist(),remote=null;
    if(id){
      const g=await gh('/gists/'+id),f=g.files&&g.files[FILE];
      if(f){let txt=f.content;if(f.truncated)txt=await (await fetch(f.raw_url)).text();remote=JSON.parse(txt);}
    }
    if(remote)S=mergeState(S,remote);
    persist();
    const body=JSON.stringify(S);
    if(id)await gh('/gists/'+id,{method:'PATCH',body:JSON.stringify({files:{[FILE]:{content:body}}})});
    else{const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'Gymlog – träningsbackup',public:false,files:{[FILE]:{content:body}}})});id=g.id;}
    cfg.gistId=id;cfg.last=Date.now();cfg.status='Synkad ✓';saveCfg();
    if(manual)toast('Synkad');
    const ae=document.activeElement;if(!ae||!/INPUT|TEXTAREA|SELECT/.test(ae.tagName))render();
  }catch(e){cfg.status='Fel: '+e.message;saveCfg();if(manual)toast('Synk misslyckades');if(ui.tab==='set'&&!(document.activeElement&&/INPUT/.test(document.activeElement.tagName)))render();}
  finally{syncing=false;}
}
window.addEventListener('online',()=>syncNow(false));
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible')return;
  if(lastToday!==today()){lastToday=today();ui.date=today();fdate=today();sw=mondayISO(today());render();}
  if(cfg.token&&Date.now()-cfg.last>120000)syncNow(false);
  if(ui.tab==='train')keepAwake();
});
